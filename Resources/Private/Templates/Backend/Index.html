<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
	<h1><f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.heading" /></h1>

	<f:if condition="{hasPage}">
		<f:then>
			<p class="text-body-secondary">
				<f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.page" />: <strong>{pageTitle}</strong> [{pageId}]
			</p>

			<f:if condition="{canCreate}">
				<p>
					<a class="btn btn-primary" href="{newUrl}">
						<core:icon identifier="actions-add" size="small" />
						<f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.new" />
					</a>
				</p>
			</f:if>

			<f:if condition="{records}">
				<f:then>
					<div class="table-fit">
						<table class="table table-striped table-hover">
							<thead>
								<tr>
									<th></th>
									<th><f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.title" /></th>
									<th><f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.areas" /></th>
									<th></th>
								</tr>
							</thead>
							<tbody>
								<f:for each="{records}" as="record">
									<tr>
										<td class="col-icon">
											<f:if condition="{record.thumbnailUrl}">
												<f:then>
													<img src="{record.thumbnailUrl}" alt="" class="mminteractive-thumb" />
												</f:then>
												<f:else>
													<core:icon identifier="content-mminteractive" size="small" />
												</f:else>
											</f:if>
										</td>
										<td><a href="{record.editUrl}"><strong>{record.title}</strong></a> <small class="text-body-secondary">[{record.uid}]</small></td>
										<td>{record.areaCount}</td>
										<td class="text-end">
											<div class="btn-group">
												<a class="btn btn-default btn-sm" href="{record.editUrl}">
													<core:icon identifier="actions-open" size="small" />
													<f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.edit" />
												</a>
												<form method="post" action="{deleteUrl}" class="d-inline" data-mminteractive-delete-form
													data-confirm="<f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.confirmDelete" arguments="{0: record.title}" />">
													<input type="hidden" name="uid" value="{record.uid}" />
													<input type="hidden" name="id" value="{pageId}" />
													<input type="hidden" name="returnUrl" value="{returnUrl}" />
													<input type="hidden" name="formToken" value="{record.deleteToken}" />
													<button type="submit" class="btn btn-default btn-sm">
														<core:icon identifier="actions-delete" size="small" />
														<f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.delete" />
													</button>
												</form>
											</div>
										</td>
									</tr>
								</f:for>
							</tbody>
						</table>
					</div>
				</f:then>
				<f:else>
					<div class="callout callout-info">
						<f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.empty" />
					</div>
				</f:else>
			</f:if>
		</f:then>
		<f:else>
			<div class="callout callout-info">
				<f:translate key="LLL:EXT:mminteractive/Resources/Private/Language/locallang_mod.xlf:list.noPage" />
			</div>
		</f:else>
	</f:if>
</f:section>

</html>
